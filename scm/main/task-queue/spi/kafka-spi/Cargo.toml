[package]
name         = "task-queue-svc-kafka-spi"
version      = "0.2.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/task-queue-svc"
rust-version = "1.98"
description  = "task-queue-svc Kafka SPI: rdkafka-backed TaskQueue implementation. Split out of message-broker-svc-kafka-spi (SRP)."
keywords     = ["task-queue", "kafka", "spi", "async", "swe"]
categories   = ["network-programming", "asynchronous"]

[package.metadata.arch]
application_type = "adapter"
service_type     = "task-queue"

[lib]
name = "task_queue_svc_kafka_spi"
path = "src/lib.rs"

[dependencies]
task-queue-pattern = { git = "https://github.com/sweengineeringlabs/task-queue-pattern.git", tag = "v0.2.0" }
futures              = "0.3"
tokio                = { version = "1.52", features = ["sync", "rt", "time"] }
rdkafka              = { version = "0.39", features = ["tokio", "cmake-build"] }
bytes                = "1"
uuid                 = "1.23"
tracing              = { version = "0.1", default-features = false }

[dev-dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
