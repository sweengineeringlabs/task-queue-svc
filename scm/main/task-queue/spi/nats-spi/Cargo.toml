[package]
name         = "task-queue-svc-nats-spi"
version      = "0.1.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/task-queue-svc"
rust-version = "1.98"
description  = "task-queue-svc NATS SPI: async-nats JetStream-backed TaskQueue implementation, competing-consumer groups. Split out of message-broker-svc-nats-spi (SRP)."
keywords     = ["task-queue", "nats", "spi", "async", "swe"]
categories   = ["network-programming", "asynchronous"]

[package.metadata.arch]
application_type = "adapter"
service_type     = "task-queue"

[lib]
name = "task_queue_svc_nats_spi"
path = "src/lib.rs"

[dependencies]
task-queue-pattern = { git = "https://github.com/sweengineeringlabs/task-queue-pattern.git", tag = "v0.1.0" }
futures              = "0.3"
tokio                = { version = "1.52", features = ["sync", "rt", "time"] }
async-nats           = "0.49"
uuid                 = "1.23"

[dev-dependencies]
tokio   = { version = "1.52", features = ["rt-multi-thread", "macros"] }
futures = "0.3"

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
